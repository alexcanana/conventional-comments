<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitHub fixture</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
      }
      .editor {
        padding-top: 100px;
      }
      textarea {
        width: 600px;
        height: 200px;
        font: 14px/18px monospace;
        padding: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <script>
      window.__ccPlatform = 'github';
    </script>
    <!-- Mirrors GitHub's markdown editor: a <markdown-toolbar> sibling marks the
         comment editor that owns the textarea. -->
    <div class="editor">
      <markdown-toolbar></markdown-toolbar>
      <div>
        <span>
          <textarea aria-label="Markdown value" placeholder="Leave a comment"></textarea>
        </span>
      </div>
    </div>
  </body>
</html>
